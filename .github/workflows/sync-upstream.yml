name: Sync upstream (safe)

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yfqh159-lab/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync main from original repository without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch main
